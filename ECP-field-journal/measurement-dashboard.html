<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECP Measurement Dashboard</title>
  <link rel="stylesheet" href="styles/logger-styles.css" />
  <link rel="stylesheet" href="lib/phosphor-regular.css" />
</head>
<body>
  <h1 class="title">ECP Measurement Framework Dashboard</h1>

  <div id="nav-container"></div>

  <section class="dashboard-intro">
    <h2>Measurement Framework Analytics</h2>
    <p>Track patterns in your ECP practice through systematic measurement across sessions. Explore trends in somatic coherence, response quality, and meaning-making over time.</p>
  </section>

  <div id="main-dashboard-container">
    <!-- Dashboard content will be inserted here by JavaScript -->
  </div>

  <div class="dashboard-actions">
    <button id="export-data-btn" class="action-button">Export Data</button>
    <button id="import-data-btn" class="action-button">Import Data</button>
    <input type="file" id="import-file-input" accept=".json" style="display: none;">
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module">
    import { 
      createOverviewDashboard,
      initTrendVisualizationStyles 
    } from './js/modules/trendVisualization.js';
    import { 
      exportMeasurementData, 
      importMeasurementData 
    } from './js/modules/storage.js';

    document.addEventListener("DOMContentLoaded", () => {
      // Initialize styles
      initTrendVisualizationStyles();

      // Create and insert the main dashboard
      const container = document.getElementById('main-dashboard-container');
      const dashboard = createOverviewDashboard({
        days: 30,
        primaryScales: [
          'somatic_coherence.pre_session.embodied_presence',
          'somatic_coherence.post_session.embodied_presence', 
          'somatic_coherence.pre_session.energetic_resonance',
          'somatic_coherence.post_session.energetic_resonance',
          'response_quality.assessment.felt_coherence',
          'response_quality.assessment.personal_relevance',
          'meaning_making.post_session.insight_emergence',
          'meaning_making.post_session.integration_ease'
        ]
      });
      
      container.appendChild(dashboard);

      // Export data functionality
      document.getElementById('export-data-btn').addEventListener('click', () => {
        try {
          const data = exportMeasurementData();
          const blob = new Blob([JSON.stringify(data, null, 2)], { 
            type: 'application/json' 
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ecp-measurement-data-${new Date().toISOString().split('T')[0]}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Measurement data exported successfully');
        } catch (error) {
          console.error('Export failed:', error);
          showToast('Failed to export data');
        }
      });

      // Import data functionality
      document.getElementById('import-data-btn').addEventListener('click', () => {
        document.getElementById('import-file-input').click();
      });

      document.getElementById('import-file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            const success = importMeasurementData(data);
            if (success) {
              showToast('Data imported successfully');
              // Refresh the dashboard
              location.reload();
            } else {
              showToast('Failed to import data');
            }
          } catch (error) {
            console.error('Import failed:', error);
            showToast('Invalid file format');
          }
        };
        reader.readAsText(file);
      });

      /**
       * Show a temporary toast message to the user.
       * @param {string} message - The message to display.
       * @param {number} duration - How long to show it (ms)
       */
      function showToast(message, duration = 3000) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.remove('hidden');
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
          toast.classList.add('hidden');
        }, duration);
      }
    });
  </script>

  <style>
    .dashboard-intro {
      margin: 2rem 0;
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
    }

    .dashboard-intro h2 {
      margin: 0 0 1rem 0;
      color: #333;
    }

    .dashboard-intro p {
      color: #666;
      font-style: italic;
      line-height: 1.6;
    }

    .dashboard-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
      padding: 1rem;
    }

    .action-button {
      padding: 0.75rem 1.5rem;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }

    .action-button:hover {
      background: #005a9e;
    }

    .action-button:active {
      transform: translateY(1px);
    }

    #main-dashboard-container {
      min-height: 400px;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 4px;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    .toast.hidden {
      opacity: 0;
      transform: translateX(100%);
    }

    @media (max-width: 768px) {
      .dashboard-actions {
        flex-direction: column;
        align-items: center;
      }

      .action-button {
        width: 200px;
      }
    }
  </style>
  <script src="js/modules/onboardingMeasurementIntegration.js"></script>
  <script type="module" src="js/modules/navigation.js"></script>
</body>
</html>
