<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal Archive | ECP Field Journal</title>
  <link rel="stylesheet" href="styles/logger-styles.css" />
  <link rel="stylesheet" href="styles/journal-archive.css" />
  <link rel="stylesheet" href="lib/phosphor-regular.css" />
</head>
<body>
  <h1 class="title"><i class="ph ph-books"></i> Journal Archive</h1>

  <div id="nav-container"></div>

  <div class="archive-header">
    <p>Your living record of experiments, reflections, and emergent insights</p>
  </div>

  <div class="archive-controls">
    <div class="filters-row">
      <div class="filter-group">
        <label for="typeFilter"><i class="ph ph-funnel"></i> Type</label>
        <select id="typeFilter">
          <option value="all">All Entries</option>
          <option value="experiment">Experiments</option>
          <option value="reflection">Reflections</option>
          <option value="note">Field Notes</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="privacyFilter"><i class="ph ph-lock"></i> Privacy</label>
        <select id="privacyFilter">
          <option value="all">All</option>
          <option value="private">Private Only</option>
          <option value="public">Public Only</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="timeFilter"><i class="ph ph-calendar"></i> Time</label>
        <select id="timeFilter">
          <option value="all">All Time</option>
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="90">Last 3 Months</option>
        </select>
      </div>
    </div>

    <div class="filter-group">
      <label for="searchBox"><i class="ph ph-magnifying-glass"></i> Search</label>
      <input
        type="text"
        id="searchBox"
        class="search-box"
        placeholder="Search insights, reflections, or metadata..."
      />
    </div>
  </div>

  <div id="archiveTimeline" class="archive-timeline">
    <div class="loading">
      <i class="ph ph-circle-notch"></i> Loading your journal entries...
    </div>
  </div>

  <!-- Entry Detail Modal -->
  <div id="entryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Entry Details</h2>
        <button class="modal-close" id="modalClose"><i class="ph ph-x"></i></button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/modules/navigation.js"></script>
  <script type="module" src="js/modules/journalArchive.js"></script>
</body>
</html>
